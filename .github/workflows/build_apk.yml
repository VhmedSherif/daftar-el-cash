name: Build Daftar El Cash APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Project & Inject App Code
        run: |
          flutter create --platforms=android --org com.daftarelcash.app --project-name daftar_el_cash app_build
          cp main.dart app_build/lib/main.dart
          rm -f app_build/test/widget_test.dart
          python3 -c '
          p = "app_build/android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          s = s.replace("android:label=\"daftar_el_cash\"", "android:label=\"دفتر الكاش\"")
          open(p, "w", encoding="utf-8").write(s)
          '

      - name: Install Dependencies & Build Release APK
        working-directory: app_build
        run: |
          flutter pub add sqflite path
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../daftar-el-cash.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daftar-el-cash-apk
          path: daftar-el-cash.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "دفتر الكاش APK (إصدار #${{ github.run_number }})"
          files: daftar-el-cash.apk
