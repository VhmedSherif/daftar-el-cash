name: Build Daftar El Cash APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Project, Set Permanent Keystore, Backup Channel & Icons
        run: |
          flutter create --platforms=android --org com.daftarelcash.v2 --project-name daftar_el_cash app_build
          cp main.dart app_build/lib/main.dart
          rm -f app_build/test/widget_test.dart
          cp app_test.dart app_build/test/app_test.dart
          python3 -c "import PIL" 2>/dev/null || (sudo apt-get update && sudo apt-get install -y python3-pil)
          python3 setup_android.py

      - name: Install Dependencies, Run Automated Tests & Build Signed APK
        working-directory: app_build
        run: |
          flutter pub add sqflite path url_launcher
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build apk --release --no-tree-shake-icons --build-name=2.0.${{ github.run_number }} --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk ../daftar-el-cash.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daftar-el-cash-apk
          path: daftar-el-cash.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "دفتر الكاش APK - النسخ الاحتياطي وتحديثات متصلة (إصدار #${{ github.run_number }})"
          files: daftar-el-cash.apk
